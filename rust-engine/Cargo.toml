[package]
name = "realssa-engine"
version = "0.1.0"
edition = "2021"
description = "RealSSA Browser Engine — high-performance HTML parser, image compressor, and page proxy"

[[bin]]
name = "realssa-engine"
path = "src/main.rs"

[dependencies]
# Web server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "timeout"] }

# HTTP client (rustls = no OpenSSL dependency needed)
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }

# HTML parsing — Servo's html5ever under the hood (browser-grade)
scraper = "0.21"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image compression
image = { version = "0.25", features = ["webp", "jpeg", "png", "gif", "bmp"] }

# URL parsing
url = "2"

# Thread-safe in-memory cache
dashmap = "6"

# Static regex compilation
once_cell = "1"
regex = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Bytes
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
