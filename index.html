  <!-- Startup loader styles — Premium Brand Loader -->
  <style>
    #startup-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      box-sizing: border-box;
      overflow: hidden;
    }

    #startup-loader::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle 500px at 50% 50%, rgba(251,191,36,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    #startup-loader .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: logoFade 1.2s ease-out;
    }

    #startup-loader .sk-star {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 0 24px rgba(245,158,11,0.3));
      animation: spinAndPulse 3s infinite linear;
    }

    #startup-loader .loader-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(to right, #fef08a, #f59e0b, #b45309);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #startup-loader .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 12px 3px rgba(251,191,36,0.5);
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    @keyframes spinAndPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes logoFade {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <!-- Synchronous script to prevent dark mode flash on load -->
  <script>
    (function () {
      try {
        var isDark = localStorage.getItem('darkMode') === 'true' ||
          (localStorage.getItem('darkMode') === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) { }
    })();
  </script>
