  <!-- Startup loader styles — Hybrid 3+4 Gold Skeleton (strictly scoped) -->
  <style>
    #startup-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #050505;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      box-sizing: border-box;
    }

    #startup-loader::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 50% 20%, rgba(251,191,36,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    #startup-loader .sk-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(251,191,36,0.08);
      flex-shrink: 0;
      box-sizing: border-box;
    }
    #startup-loader .sk-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #startup-loader .sk-star { width: 28px; height: 28px; flex-shrink: 0; }
    #startup-loader .sk-brand-pill {
      width: 100px; height: 14px; border-radius: 4px;
      background: rgba(251,191,36,0.12);
    }
    #startup-loader .sk-nav-pills { display: flex; gap: 10px; }
    #startup-loader .sk-nav-pill {
      width: 56px; height: 10px; border-radius: 10px;
      background: rgba(255,255,255,0.06);
    }

    #startup-loader .sk-tabs {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      overflow: hidden;
      flex-shrink: 0;
      box-sizing: border-box;
    }
    #startup-loader .sk-tab {
      height: 9px; border-radius: 10px;
      background: rgba(255,255,255,0.05); flex-shrink: 0;
    }

    #startup-loader .sk-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      padding: 14px 16px;
      flex: 1;
      overflow: hidden;
      box-sizing: border-box;
    }
    @media (min-width: 768px) {
      #startup-loader .sk-body { grid-template-columns: 1.6fr 1fr; }
    }

    #startup-loader .sk-hero {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(251,191,36,0.08);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #startup-loader .sk-hero-img {
      height: 200px;
      background: rgba(255,255,255,0.04);
      flex-shrink: 0;
    }
    @media (min-width: 768px) { #startup-loader .sk-hero-img { height: 260px; } }
    #startup-loader .sk-hero-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    #startup-loader .sk-badge { width: 60px; height: 9px; border-radius: 6px; background: rgba(251,191,36,0.18); }
    #startup-loader .sk-line { height: 10px; border-radius: 4px; background: rgba(255,255,255,0.07); display: block; }
    #startup-loader .sk-line.w-full { width: 100%; }
    #startup-loader .sk-line.w-80  { width: 80%; }
    #startup-loader .sk-line.w-60  { width: 60%; }
    #startup-loader .sk-line.w-40  { width: 40%; }
    #startup-loader .sk-line.thin  { height: 8px; background: rgba(255,255,255,0.04); }

    #startup-loader .sk-side { display: flex; flex-direction: column; gap: 10px; }
    #startup-loader .sk-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      overflow: hidden;
      box-sizing: border-box;
    }
    #startup-loader .sk-thumb {
      width: 62px; height: 52px; border-radius: 7px;
      background: rgba(255,255,255,0.05); flex-shrink: 0;
    }
    #startup-loader .sk-card-body { display: flex; flex-direction: column; gap: 8px; flex: 1; overflow: hidden; }

    /* Gold laser shimmer — only inside #startup-loader */
    @keyframes _skGoldShimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
    #startup-loader .sk-shimmer {
      position: relative;
      overflow: hidden;
    }
    #startup-loader .sk-shimmer::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(251,191,36,0.22) 50%,
        rgba(255,255,255,0.10) 55%,
        rgba(251,191,36,0.12) 60%,
        transparent 70%
      );
      animation: _skGoldShimmer 1.8s cubic-bezier(0.4,0,0.2,1) infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      #startup-loader .sk-shimmer::after { animation: none; }
    }
  </style>

  <!-- Synchronous script to prevent dark mode flash on load -->
  <script>
    (function () {
      try {
        var isDark = localStorage.getItem('darkMode') === 'true' ||
          (localStorage.getItem('darkMode') === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) { }
    })();
  </script>
